<!doctype html>
<html>
  <body style="font-family: sans-serif; padding: 2rem">
    <button id="g">Continue with Google</button>
    <button id="a">Continue with Apple</button>
    <button id="o">Sign out</button>
    <h3>URL hash on load</h3>
    <pre id="hash"></pre>
    <h3>Session</h3>
    <pre id="out">waiting…</pre>

    <script>
      document.getElementById("hash").textContent = location.hash || "(empty)";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      var c = supabase.createClient(
        "https://knvjmsnwzskbageetbam.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtudmptc253enNrYmFnZWV0YmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NTE0MzIsImV4cCI6MjA5NDUyNzQzMn0.jaZ91wRrCyb2Ud5KpNQOaPgCPGd0fXyoW68Kp16HfK0",
      );
      var back = { redirectTo: location.origin + location.pathname };

      g.onclick = function () {
        c.auth.signInWithOAuth({ provider: "google", options: back });
      };
      a.onclick = function () {
        c.auth.signInWithOAuth({ provider: "apple", options: back });
      };
      o.onclick = function () {
        c.auth.signOut().then(function () {
          location.reload();
        });
      };

      c.auth.onAuthStateChange(function (event, session) {
        out.textContent =
          event +
          "\n\n" +
          (session ? JSON.stringify(session.user, null, 2) : "no session");
      });
    </script>
  </body>
</html>
