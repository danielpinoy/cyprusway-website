<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#1b3b6b" />
    <title>CyprusWay</title>
    <meta name="description" content="Step inside Cyprus before you arrive with immersive 360 degree tours and guided narration." />
    <script>
      /* Applies the stored language's direction to <html> before first paint, so an
         RTL visitor never sees a frame of LTR layout. Only touches attributes outside
         the React root, so it cannot cause a hydration mismatch. The dictionary itself
         is swapped by React after hydration, exactly as the vanilla site did. */
      (function () {
        try {
          var dirs = { en: 'ltr', pl: 'ltr', de: 'ltr', el: 'ltr', sv: 'ltr' };
          var stored = localStorage.getItem('cw_lang');
          var override = new URLSearchParams(location.search).get('dir');
          if (stored && dirs[stored]) {
            document.documentElement.lang = stored;
            document.documentElement.dir = dirs[stored];
          }
          if (override === 'rtl' || override === 'ltr') document.documentElement.dir = override;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
