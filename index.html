<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#1b3b6b" />
    <title>CyprusWay</title>
    <meta name="description" content="Step inside Cyprus before you arrive with immersive 360 degree tours and guided narration." />

    <!-- Both backends are contacted on every page: the catalogue fetch goes to Supabase
         during hydration and the card photos come from Directus right after. Opening the
         connections up front moves ~120 ms (DNS 5 + TCP 55 + TLS 60, measured from Cyprus
         30 Aug 2026) off the critical path - docs/PERF-MEASUREMENT-2026-08-30.md.
         The image host is cdn.cyprusway.eu — the Cloudflare Worker in front of Directus
         (infra/cdn-worker/worker.js). It reverts together with CDN_HOST in
         directusImage.ts: flip that to null, point this line back at the Railway host,
         one commit. (The misbehaving-cache revert is the Worker's PASSTHROUGH var and
         needs no change here.)
         crossorigin on the Supabase line only: fetch() runs in CORS mode and draws from
         the uncredentialed connection pool; <img> is no-cors and draws from the
         credentialed pool. Each preconnect must match the pool its consumer uses. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://cdn.cyprusway.eu" />
    <script>
      /* Applies the stored language's direction to <html> before first paint, so an
         RTL visitor never sees a frame of LTR layout. Only touches attributes outside
         the React root, so it cannot cause a hydration mismatch. The dictionary itself
         is swapped by React after hydration, exactly as the vanilla site did. */
      (function () {
        try {
          var dirs = { en: 'ltr', pl: 'ltr', de: 'ltr', el: 'ltr', sv: 'ltr' };
          var stored = localStorage.getItem('cw_lang');
          var override = new URLSearchParams(location.search).get('dir');
          if (stored && dirs[stored]) {
            document.documentElement.lang = stored;
            document.documentElement.dir = dirs[stored];
          }
          if (override === 'rtl' || override === 'ltr') document.documentElement.dir = override;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
